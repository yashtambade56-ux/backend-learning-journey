<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Function</h1>
</body>

<script>

    let a = 100;
    let b = 99;

    // arrow function (add)
    const add = (a, b) => {
        return a + b;
    };
console.log(add(a, b));

    // function declaration (sub)
    const sub = function(a, b) {
        return a - b;
    };
console.log(sub(a, b));

// normal function declaration (sub)

function sub(a, b) {
    return a - b;
};
console.log(sub(a, b));

</script>
</html>
