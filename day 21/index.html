<!DOCTYPE html>
<html>

<body>
    <script>
        const socket = new WebSocket("ws://localhost:8080");
        socket.onopen = () => {
            console.log("Connected to WebSocket server");
            socket.send("Hello server");
        };
        socket.onmessage = event => console.log("Message from server:", event.data);
        socket.onclose = () => {
            socket.send("hi");
        };
        socket.send("hello");
    </script>
</body>

</html>
