<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Example</title>
</head>
<body>

<script>
    let arr = [1, 2, 3, 4];

    function x() {
        let result = arr.map((ele) => {
            return ele * 2;
        });

        console.log(result);
    }

    x();
</script>

</body>
</html>
