<script>
    
    const newPromise = new Promise((resolve, reject) => {
    const marks = 80;
    const requiredMarks = 75;

    setTimeout(() => {
        if (marks >= requiredMarks) {
            resolve("Congratulations! I will gift you a bike.");
        } else {
            reject("Sorry, you need at least 75 marks to get the bike.");
        }
    }, 2000);
});

newPromise
    .then((message) => {
        console.log(message);
    })
    .catch((error) => {
        console.log(error);
    });
</script>
</html>
